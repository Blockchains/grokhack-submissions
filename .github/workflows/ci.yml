name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  submission:
    name: Validate submission.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/validate_submission.py submission.json
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact .
  starter:
    name: Starter tests + e2e (api.x.ai)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: starter } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm test
      - run: npm run e2e
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
  build:
    name: Build & test your project (auto-detected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Node (package.json at repo root)
        if: hashFiles('package.json') != ''
        run: |
          npm ci || npm install
          npm run build --if-present
          npm test --if-present
      - name: Python (requirements.txt / pyproject.toml at repo root)
        if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        run: |
          python3 -m pip install -q -r requirements.txt 2>/dev/null || python3 -m pip install -q .
          python3 -m pip install -q pytest && (pytest -q || [ $? -eq 5 ])
      - run: echo "build checks done"
